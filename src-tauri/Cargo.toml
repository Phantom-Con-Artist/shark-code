[package]
name = "shark-code"
version = "0.1.0"
description = "Shark Code - Agent-First Code Editor"
authors = ["Subhradeep"]
edition = "2024"

[lib]
name = "shark_code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shark-core = { path = "../crates/shark-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
keyring = "3"
ignore = "0.4"
walkdir = "2"
regex = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
