[project]
name = "shark-runtime"
version = "0.1.0"
description = "Shared workspace, graph, change workflow and ADK runtime for Shark Code"
requires-python = ">=3.12,<3.14"
dependencies = ["graphifyy==0.9.99", "google-adk==2.13.0", "sqlalchemy[asyncio]>=2,<3"]

[project.scripts]
shark-runtime = "shark_runtime.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shark_runtime"]
