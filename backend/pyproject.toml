[project]
name = "shark-runtime"
version = "0.1.0"
description = "Workspace, code graph, change review and agent runtime for Shark Code"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "graphifyy==0.9.99",
    "google-adk==2.13.0",
    "sqlalchemy[asyncio]>=2,<3",
    "anthropic>=0.70,<1",
    "litellm>=1.70,<2",
    "mcp>=2",
    "playwright>=1.64.1",
]

[project.scripts]
shark-runtime = "shark_runtime.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shark_runtime"]
