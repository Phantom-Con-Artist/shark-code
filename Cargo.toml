[workspace]
members = ["crates/shark-core", "crates/shark-cli"]
exclude = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/Phantom-Con-Artist/shark-code"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.8"
aho-corasick = "1"
ignore = "0.4"
regex = "1"
fs2 = "0.4"
tempfile = "3"
